<title>Strategy Tester Report</title>
<style>
  :root{
    --page-bg:#e7e9ec;
    --page-bg-dark:#1c1e22;
  }
  @media (prefers-color-scheme: dark){ :root{ --shell-bg:var(--page-bg-dark); } }
  :root{ --shell-bg:var(--page-bg); }
  :root[data-theme="dark"]{ --shell-bg:var(--page-bg-dark); }
  :root[data-theme="light"]{ --shell-bg:var(--page-bg); }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--shell-bg);
    font-family:Tahoma, "Segoe UI", Arial, sans-serif;
    padding:20px 10px 40px;
    display:flex;
    justify-content:center;
  }

  .sheet{
    width:100%;
    max-width:750px;
    background:#ffffff;
    color:#1a1a1a;
  }

  .legend{
    font-size:10px;
    padding:2px 6px 1px;
  }
  .legend .bal{color:#3333cc;}
  .legend .sep{color:#8a8a8a;}
  .legend .eq{color:#009a00;}

  canvas{display:block;width:100%;}

  .report{ width:100%; }
  .row{ display:grid; grid-template-columns:repeat(3,1fr); }
  .row:nth-child(odd){ background:#ffffff; }
  .row:nth-child(even){ background:#ebebeb; }
  .cell{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:2.6px 14px 2.6px 8px;
    font-size:11px;
    overflow:hidden;
  }
  .cell .l{ color:#3a3a3a; white-space:nowrap; }
  .cell .v{ color:#000; font-weight:400; white-space:nowrap; font-variant-numeric:tabular-nums; }

  .foot{
    padding:6px 8px 10px;
    font-size:9px;
    color:#aaadb1;
    text-align:right;
  }
</style>

<div class="sheet">
  <div class="legend"><span class="bal">Баланс</span> <span class="sep">/</span> <span class="eq">Средства</span></div>

  <canvas id="equityChart" width="1500" height="348"></canvas>

  <div class="report" id="report"></div>

  <div class="foot">generated report replica</div>
</div>

<script>
(function(){
  // ---------------------------------------------------------------
  // Table data + render (label/value triples, right-aligned values)
  // ---------------------------------------------------------------
  const rows = [
    [["Initial Deposit","100 000.00"]],
    [["Bars","21289"],["Ticks","1 257 170"],["",""]],
    [["Total Net Profit","26 978.31"],["Gross Profit","54 115.42"],["Gross Loss","-27 137.11"]],
    [["Profit Factor","1.99"],["Expected Payoff","20.35"],["Sharpe Ratio","0.24"]],
    [["Recovery Factor","12.98"],["",""],["",""]],
    [["Balance Drawdown Absolute","556.13"],["Balance Drawdown Maximal","1 294.17 (1.16%)"],["Balance Drawdown Relative","1.23% (1 287.53)"]],
    [["Equity Drawdown Absolute","487.31"],["Equity Drawdown Maximal","2 078.53 (1.84%)"],["Equity Drawdown Relative","1.84% (2 078.53)"]],
    [["Total Trades","1326"],["Short Trades (won %)","622 (50.16%)"],["Long Trades (won %)","704 (49.72%)"]],
    [["Total Deals","2658"],["Profit Trades (% of total)","662 (49.92%)"],["Loss Trades (% of total)","664 (50.08%)"]],
    [["","Largest"],["profit trade","440.20"],["loss trade","-190.65"]],
    [["","Average"],["profit trade","81.75"],["loss trade","-40.87"]],
    [["","Maximum"],["consecutive wins ($)","17 (1 644.20)"],["consecutive losses ($)","16 (-619.66)"]],
    [["","Maximal"],["consecutive profit (count)","2 901.64 (15)"],["consecutive loss (count)","-747.32 (13)"]]
  ];

  const reportEl = document.getElementById('report');
  rows.forEach(cols => {
    const row = document.createElement('div');
    row.className = 'row';
    for (let i = 0; i < 3; i++){
      const [l, v] = cols[i] || ["",""];
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.innerHTML = `<span class="l">${l}</span><span class="v">${v}</span>`;
      row.appendChild(cell);
    }
    reportEl.appendChild(row);
  });

  // ---------------------------------------------------------------
  // Chart: equity/balance pane + margin-level pane + date axis strip
  // ---------------------------------------------------------------
  const cvs = document.getElementById('equityChart');
  const ctx = cvs.getContext('2d');
  const W = cvs.width, H = cvs.height;
  const mainH = 284;
  const marginH = 40;
  const dateH = H - mainH - marginH; // 24
  const padL = 6, padR = 92;

  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(20100104);

  // shape anchors (fraction of series, value) tracing the source curve
  const anchors = [
    [0.00,100000],[0.05,100700],[0.09,101300],[0.13,100850],[0.17,101600],
    [0.20,102400],[0.24,101650],[0.27,101300],[0.30,102200],[0.32,104500],
    [0.335,108200],[0.36,109600],[0.40,108850],[0.44,109400],[0.50,110100],
    [0.55,110400],[0.58,111400],[0.62,112700],[0.66,114100],[0.70,115600],
    [0.74,116300],[0.78,117200],[0.81,118600],[0.83,120500],[0.855,122600],
    [0.88,122900],[0.91,122500],[0.93,122650],[0.96,123800],[1.00,127348]
  ];
  function anchorAt(t){
    for (let i = 1; i < anchors.length; i++){
      if (t <= anchors[i][0]){
        const [t0,v0] = anchors[i-1], [t1,v1] = anchors[i];
        const f = (t - t0) / (t1 - t0 || 1);
        return v0 + (v1 - v0) * f;
      }
    }
    return anchors[anchors.length-1][1];
  }

  const N = 1326;
  const balance = [], equity = [];
  let noise = 0, eWalk = 0;
  for (let i = 0; i <= N; i++){
    const t = i / N;
    noise += (rnd() - 0.5) * 90;
    noise *= 0.9;
    const b = anchorAt(t) + noise;
    balance.push(b);

    const scale = 0.55 + t*t*3.0;
    eWalk = eWalk*0.80 + (rnd() - 0.5) * 260 * scale;
    let e = b + eWalk;
    if (rnd() < 0.05) e += (rnd() - 0.5) * 900 * scale;
    equity.push(e);
  }

  const levels = [127348,122468,117587,112706,107826,102945,98065];
  const lo = levels[levels.length-1], hi = levels[0];

  const allDateLabels = ['2010.01.04','2010.01.15','2010.02.01','2010.02.16','2010.03.04',
    '2010.03.18','2010.04.01','2010.04.15','2010.04.28','2010.05.17','2010.06.02',
    '2010.06.15','2010.06.25','2010.07.15','2010.07.28','2010.08.09','2010.08.24',
    '2010.09.06','2010.09.21','2010.10.07','2010.10.22','2010.11.04'];
  const dateLabels = allDateLabels.filter((_,i) => i % 2 === 0 || i === allDateLabels.length-1);

  function xFor(i, len){ return padL + (i/len) * (W - padL - padR); }
  function yFor(v){ return (1 - (v - lo)/(hi - lo)) * mainH; }

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,W,H);

  // dotted grid + axis labels (main pane)
  ctx.strokeStyle = '#c2c2c2';
  ctx.lineWidth = 1;
  ctx.setLineDash([2,2]);
  ctx.font = '18px Tahoma, Arial, sans-serif';
  ctx.fillStyle = '#5a5a5a';
  ctx.textBaseline = 'middle';
  levels.forEach(v => {
    const y = yFor(v);
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(W - padR, y);
    ctx.stroke();
    ctx.fillText(String(v), W - padR + 10, y === 0 ? 8 : y);
  });
  dateLabels.forEach((_, i) => {
    const x = padL + (i/(dateLabels.length-1)) * (W - padL - padR);
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, mainH);
    ctx.stroke();
  });
  ctx.setLineDash([]);

  function drawLine(series, color, width){
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    series.forEach((v,i) => {
      const x = xFor(i, series.length-1), y = yFor(v);
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
  }
  drawLine(balance, '#2233aa', 2.8);
  drawLine(equity, '#00b000', 1.3);

  // separator between main pane and margin pane
  ctx.strokeStyle = '#8f959d';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, mainH+1);
  ctx.lineTo(W, mainH+1);
  ctx.stroke();

  // ---- margin-level pane: dense green spike area, no line ----
  const mBase = mainH + marginH - 4;
  const bars = 220;
  const seed2 = mulberry32(4242);
  ctx.fillStyle = '#00b000';
  ctx.beginPath();
  ctx.moveTo(padL, mBase);
  for (let i = 0; i <= bars; i++){
    const x = padL + (i/bars) * (W - padL - padR);
    let h = seed2() * (marginH - 14) * 0.30;
    if (seed2() < 0.05) h = (marginH - 14) * (0.55 + seed2()*0.45);
    ctx.lineTo(x, mBase - h);
  }
  ctx.lineTo(W - padR, mBase);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#c81414';
  ctx.font = '15px Tahoma, Arial, sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('6119%', W - padR - 2, mainH + 14);
  ctx.textAlign = 'left';

  // ---- date-axis strip (gray band) ----
  ctx.fillStyle = '#ebebeb';
  ctx.fillRect(0, mainH+marginH, W, dateH);
  ctx.fillStyle = '#6b6b6b';
  ctx.font = '11px Tahoma, Arial, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  const dy = mainH + marginH + dateH/2 + 1;
  dateLabels.forEach((d,i) => {
    let x = padL + (i/(dateLabels.length-1)) * (W - padL - padR);
    if (i===0) { ctx.textAlign='left'; x = padL; }
    else if (i===dateLabels.length-1) { ctx.textAlign='right'; x = W - padR; }
    else { ctx.textAlign='center'; }
    ctx.fillText(d, x, dy);
  });
  ctx.textAlign = 'left';
})();
</script>
