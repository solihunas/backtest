<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT5 Position Overlay</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: #0a0e1a; color: #e0e0e0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
  body { min-height: 100vh; padding-bottom: 40px; }

  /* ── TOP TOOLBAR ─────────────────────────────────────────── */
  #toolbar {
    position: sticky; top: 0; z-index: 100;
    background: #0f1729; border-bottom: 1px solid #1e2a44;
    padding: 8px 10px;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  #toolbar h3 {
    font-size: 12px; color: #4fc3f7; font-weight: 700;
    width: 100%; margin-bottom: 4px;
  }
  .btn {
    padding: 7px 12px; border: none; border-radius: 5px;
    font-size: 12px; font-weight: 700; cursor: pointer;
    white-space: nowrap; transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.7; }
  .btn-buy    { background: #2962FF; color: #fff; }
  .btn-sell   { background: #E53935; color: #fff; }
  .btn-upload { background: #37474f; color: #cfd8dc; }
  .btn-preview{ background: #00897b; color: #fff; }
  .btn-reset  { background: #455a64; color: #cfd8dc; }
  #file-input { display: none; }

  /* ── CANVAS WRAP ─────────────────────────────────────────── */
  #canvas-wrap {
    position: relative;
    width: 100%;
    background: #ffffff;
    border-bottom: 2px solid #1e2a44;
    overflow: hidden;
    /* aspect ratio updated dynamically once image loads */
    aspect-ratio: 9 / 16;
  }
  #canvas-bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain; object-position: center top;
    pointer-events: none; user-select: none; -webkit-user-drag: none;
  }
  #overlay-svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    overflow: visible;
    touch-action: none;
  }

  #upload-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(15,23,41,0.92);
    flex-direction: column; gap: 14px; z-index: 50;
    padding: 20px; text-align: center;
  }
  #upload-overlay p     { color: #4fc3f7; font-size: 14px; font-weight: 600; }
  #upload-overlay span  { color: #90a4ae; font-size: 11px; }

  #drag-hint {
    position: absolute; bottom: 8px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.55); color: #fff;
    font-size: 10px; padding: 4px 10px; border-radius: 10px;
    pointer-events: none; white-space: nowrap; z-index: 10;
  }
  #drag-hint.hidden { display: none; }

  /* ── POSITION CARDS ──────────────────────────────────────── */
  #pos-section {
    padding: 12px 10px;
  }
  #pos-section h4 {
    font-size: 11px; color: #4fc3f7;
    text-transform: uppercase; letter-spacing: 1.2px;
    margin-bottom: 10px; padding-left: 4px;
  }
  .pos-card {
    background: #0f1729;
    border: 1px solid #1e2a44;
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .pos-card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
  }
  .pos-card-header.buy  { background: #0d1a3d; color: #2962FF; }
  .pos-card-header.sell { background: #2d1212; color: #E53935; }

  .pos-card-body {
    padding: 10px 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 10px;
  }
  .pos-card-body .full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label {
    font-size: 9.5px; color: #708090;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .field input {
    padding: 7px 9px;
    background: #0a0e1a;
    border: 1px solid #1e2a44;
    border-radius: 5px;
    color: #e0e0e0;
    font-size: 13px;
    text-align: right;
    font-family: inherit;
    width: 100%;
  }
  .field input:focus { outline: none; border-color: #4fc3f7; }

  .row-2 {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    grid-column: 1 / -1;
  }
  .group-title {
    font-size: 9.5px; color: #4fc3f7;
    text-transform: uppercase; letter-spacing: 0.5px;
    grid-column: 1 / -1;
    margin-top: 4px;
    padding-top: 8px;
    border-top: 1px dashed #1e2a44;
  }
  .btn-del {
    grid-column: 1 / -1;
    padding: 8px;
    background: #2a1818;
    border: 1px solid #4a2020;
    border-radius: 5px;
    color: #ef9a9a;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }
  .btn-del:active { background: #E53935; color: #fff; }

  #empty-state {
    text-align: center; color: #455a64;
    font-size: 12px; padding: 30px 10px;
  }

  /* ── PREVIEW MODE ────────────────────────────────────────── */
  body.preview #toolbar,
  body.preview #pos-section { display: none; }
  body.preview #canvas-wrap {
    border-bottom: none;
    min-height: 100vh;
  }
  body.preview #drag-hint { display: none; }
  #exit-preview {
    display: none;
    position: fixed; top: 12px; right: 12px;
    z-index: 200;
    padding: 8px 14px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    border: none; border-radius: 20px;
    font-size: 12px; font-weight: 700;
    cursor: pointer;
  }
  body.preview #exit-preview { display: block; }
</style>
</head>
<body>

<!-- TOOLBAR -->
<div id="toolbar">
  <h3>📊 MT5 Position Overlay</h3>
  <button class="btn btn-buy"    onclick="addPosition('BUY')">＋ BUY</button>
  <button class="btn btn-sell"   onclick="addPosition('SELL')">＋ SELL</button>
  <button class="btn btn-upload" onclick="document.getElementById('file-input').click()">📷 Chart</button>
  <input type="file" id="file-input" accept="image/*" onchange="loadImage(event)">
  <button class="btn btn-preview" onclick="enterPreview()">👁 Preview</button>
  <button class="btn btn-reset"   onclick="resetAll()">↺ Reset</button>
</div>

<!-- CANVAS -->
<div id="canvas-wrap">
  <img id="canvas-bg" alt="chart" draggable="false">
  <svg id="overlay-svg" preserveAspectRatio="none"></svg>

  <div id="upload-overlay">
    <p>📸 Upload Screenshot Chart MT5</p>
    <span>Tap untuk pilih, atau drag & drop</span>
    <button class="btn btn-upload" style="padding:10px 22px;font-size:13px;"
            onclick="document.getElementById('file-input').click()">Upload Screenshot</button>
  </div>

  <div id="drag-hint">💡 Drag garis untuk geser posisi</div>
</div>

<!-- POSITION CARDS -->
<div id="pos-section">
  <h4>Open Positions</h4>
  <div id="pos-list"></div>
</div>

<button id="exit-preview" onclick="exitPreview()">✕ Exit Preview</button>

<script>
// ─── STATE ───────────────────────────────────────────────────────
let positions = [];
let nextId = 1;
let dragging = null;
let canvasEl, svgEl, imgEl;

const COLORS = { BUY: '#2962FF', SELL: '#E53935' };

const DEFAULTS = {
  boxW: 78,      // price box width (px)
  boxH: 22,      // price box height (px)
  labelX: 8,     // left label X offset
};

// ─── INIT ────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  canvasEl = document.getElementById('canvas-wrap');
  svgEl    = document.getElementById('overlay-svg');
  imgEl    = document.getElementById('canvas-bg');

  // Default 2 posisi sesuai screenshot referensi
  addPosition('BUY',  4082.765, 0.01, { py: 30 });   // 30% from top
  addPosition('SELL', 4078.238, 0.01, { py: 68 });   // 68% from top

  // Drag & drop file
  canvasEl.addEventListener('dragover', e => e.preventDefault());
  canvasEl.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) loadFile(f);
  });

  // Drag listeners
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup',   onMouseUp);
  window.addEventListener('touchmove', onTouchMove, { passive: false });
  window.addEventListener('touchend',  onTouchEnd);
  window.addEventListener('resize',    renderAll);

  renderAll();
});

// ─── POSITION CRUD ───────────────────────────────────────────────
function addPosition(type, price, lot, opts = {}) {
  positions.push({
    id:     nextId++,
    type,
    price:  price ?? (type === 'BUY' ? 4082.765 : 4078.238),
    lot:    lot   ?? 0.01,
    py:     opts.py     ?? (type === 'BUY' ? 30 : 65),  // % of canvas height
    labelX: opts.labelX ?? DEFAULTS.labelX,             // px from left
    boxW:   opts.boxW   ?? DEFAULTS.boxW,
    boxH:   opts.boxH   ?? DEFAULTS.boxH,
  });
  renderAll();
  renderPanel();
}

function deletePosition(id) {
  positions = positions.filter(p => p.id !== id);
  renderAll();
  renderPanel();
}

function resetAll() {
  positions = []; nextId = 1;
  addPosition('BUY',  4082.765, 0.01, { py: 30 });
  addPosition('SELL', 4078.238, 0.01, { py: 68 });
}

// ─── IMAGE LOAD ──────────────────────────────────────────────────
function loadImage(e) { const f = e.target.files[0]; if (f) loadFile(f); }
function loadFile(f) {
  const url = URL.createObjectURL(f);
  imgEl.src = url;
  imgEl.onload = () => {
    // Match canvas aspect ratio to image so it ga ke-stretch
    const ratio = imgEl.naturalWidth / imgEl.naturalHeight;
    canvasEl.style.aspectRatio = ratio;
    document.getElementById('upload-overlay').style.display = 'none';
    renderAll();
  };
}

// ─── RENDER OVERLAY ──────────────────────────────────────────────
function renderAll() {
  svgEl.innerHTML = '';
  const W = canvasEl.clientWidth;
  const H = canvasEl.clientHeight;
  if (!W || !H) return;

  positions.forEach(p => {
    const color = COLORS[p.type];
    const py = (p.py / 100) * H;  // py is stored as % of canvas height

    // ── Price box dimensions (manual px, font auto-fits)
    const boxW = p.boxW;
    const boxH = p.boxH;
    const boxX = W - boxW - 2;     // mepet ke kanan (2px margin)
    const boxY = py - boxH / 2;
    const lineEndX = boxX;

    // ── Dashed line ───────────────────────────────────────────
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', 0);
    line.setAttribute('y1', py);
    line.setAttribute('x2', lineEndX);
    line.setAttribute('y2', py);
    line.setAttribute('stroke', color);
    line.setAttribute('stroke-dasharray', '5,4');
    line.setAttribute('stroke-width', '1.3');
    svgEl.appendChild(line);

    // ── Drag hit area (thicker invisible line) ────────────────
    const hit = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    hit.setAttribute('x1', 0);
    hit.setAttribute('y1', py);
    hit.setAttribute('x2', W);
    hit.setAttribute('y2', py);
    hit.setAttribute('stroke', 'transparent');
    hit.setAttribute('stroke-width', '24');
    hit.style.cursor = 'ns-resize';
    hit.style.pointerEvents = 'all';
    hit.addEventListener('mousedown',  e => startDrag(e, p.id));
    hit.addEventListener('touchstart', e => startDragTouch(e, p.id), { passive: false });
    svgEl.appendChild(hit);

    // ── LEFT LABEL "BUY 0.01" — plain text, no box, above line
    const lblText = `${p.type} ${Number(p.lot).toFixed(2)}`;
    const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    lbl.setAttribute('x',    Math.max(2, p.labelX));
    lbl.setAttribute('y',    py - 6);
    lbl.setAttribute('fill', color);
    lbl.setAttribute('font-family', 'Segoe UI, Roboto, Arial, sans-serif');
    lbl.setAttribute('font-size',   '13');
    lbl.setAttribute('font-weight', '400');
    lbl.textContent = lblText;
    svgEl.appendChild(lbl);

    // ── PRICE BOX (outline + white bg + colored text auto-fit)
    const box = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    box.setAttribute('x',      boxX);
    box.setAttribute('y',      boxY);
    box.setAttribute('width',  boxW);
    box.setAttribute('height', boxH);
    box.setAttribute('fill',         '#ffffff');
    box.setAttribute('stroke',       color);
    box.setAttribute('stroke-width', '1.2');
    svgEl.appendChild(box);

    // Font size: 70% of box height. Auto-shrink if width overflows.
    const priceStr = Number(p.price).toFixed(3);
    let fontSize = Math.max(8, Math.round(boxH * 0.7));
    // Rough estimate: char width ≈ fontSize × 0.55. Shrink if too wide.
    const maxTextW = boxW - 8;
    const estTextW = priceStr.length * fontSize * 0.55;
    if (estTextW > maxTextW) {
      fontSize = Math.max(8, Math.floor(maxTextW / (priceStr.length * 0.55)));
    }

    const ptxt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    ptxt.setAttribute('x',    boxX + boxW / 2);
    ptxt.setAttribute('y',    py + 0.5);
    ptxt.setAttribute('fill', color);
    ptxt.setAttribute('font-family', 'Segoe UI, Roboto, Arial, sans-serif');
    ptxt.setAttribute('font-size',   fontSize);
    ptxt.setAttribute('font-weight', '400');
    ptxt.setAttribute('text-anchor',       'middle');
    ptxt.setAttribute('dominant-baseline', 'central');
    ptxt.textContent = priceStr;
    svgEl.appendChild(ptxt);
  });
}

// ─── RENDER PANEL ────────────────────────────────────────────────
function renderPanel() {
  const list = document.getElementById('pos-list');
  list.innerHTML = '';
  if (positions.length === 0) {
    list.innerHTML = '<div id="empty-state">Belum ada posisi. Tap ＋BUY atau ＋SELL.</div>';
    return;
  }
  positions.forEach(p => {
    const cls = p.type === 'BUY' ? 'buy' : 'sell';
    const card = document.createElement('div');
    card.className = 'pos-card';
    card.dataset.id = p.id;
    card.innerHTML = `
      <div class="pos-card-header ${cls}">
        <span>${p.type} #${p.id}</span>
        <span style="font-size:11px;opacity:0.7;font-weight:400;">${Number(p.lot).toFixed(2)} lot</span>
      </div>
      <div class="pos-card-body">
        <div class="field">
          <label>Harga</label>
          <input type="number" step="0.001" value="${p.price}"
                 onchange="updatePos(${p.id},'price',this.value)">
        </div>
        <div class="field">
          <label>Lot</label>
          <input type="number" step="0.01" min="0.01" value="${p.lot}"
                 onchange="updatePos(${p.id},'lot',this.value)">
        </div>

        <div class="group-title">Kalibrasi Label</div>
        <div class="field">
          <label>Posisi Y (%)</label>
          <input type="number" step="0.1" min="0" max="100" value="${p.py.toFixed(1)}"
                 onchange="updatePos(${p.id},'py',this.value)">
        </div>
        <div class="field">
          <label>Label X (px)</label>
          <input type="number" min="0" max="1000" value="${p.labelX}"
                 onchange="updatePos(${p.id},'labelX',this.value)">
        </div>

        <div class="group-title">Ukuran Kotak Harga</div>
        <div class="field">
          <label>Width (px)</label>
          <input type="number" min="20" max="500" value="${p.boxW}"
                 onchange="updatePos(${p.id},'boxW',this.value)">
        </div>
        <div class="field">
          <label>Height (px)</label>
          <input type="number" min="12" max="200" value="${p.boxH}"
                 onchange="updatePos(${p.id},'boxH',this.value)">
        </div>

        <button class="btn-del" onclick="deletePosition(${p.id})">🗑 Hapus Posisi</button>
      </div>
    `;
    list.appendChild(card);
  });
}

function updatePos(id, field, val) {
  const p = positions.find(x => x.id === id);
  if (!p) return;
  const num = parseFloat(val);
  if (isNaN(num)) return;
  if (field === 'py')     p.py     = Math.max(0, Math.min(100, num));
  else if (field === 'labelX') p.labelX = Math.max(0, Math.min(1000, Math.round(num)));
  else if (field === 'boxW')   p.boxW   = Math.max(20, Math.min(500, Math.round(num)));
  else if (field === 'boxH')   p.boxH   = Math.max(12, Math.min(200, Math.round(num)));
  else p[field] = num;
  renderAll();
}

// ─── DRAG ────────────────────────────────────────────────────────
function startDrag(e, id) {
  e.preventDefault();
  const p = positions.find(x => x.id === id);
  if (!p) return;
  dragging = { id, startY: e.clientY, startPy: p.py };
}
function startDragTouch(e, id) {
  e.preventDefault();
  const p = positions.find(x => x.id === id);
  if (!p) return;
  dragging = { id, startY: e.touches[0].clientY, startPy: p.py };
}
function onMouseMove(e) { if (dragging) doDrag(e.clientY); }
function onTouchMove(e) {
  if (!dragging) return;
  e.preventDefault();
  doDrag(e.touches[0].clientY);
}
function doDrag(clientY) {
  const p = positions.find(x => x.id === dragging.id);
  if (!p) return;
  const H = canvasEl.clientHeight;
  const dyPx  = clientY - dragging.startY;
  const dyPct = (dyPx / H) * 100;
  p.py = Math.max(0.5, Math.min(99.5, dragging.startPy + dyPct));
  renderAll();
  // live sync the Y input in panel
  const card = document.querySelector(`.pos-card[data-id="${p.id}"]`);
  if (card) {
    const inputs = card.querySelectorAll('input');
    if (inputs[2]) inputs[2].value = p.py.toFixed(1);
  }
}
function onMouseUp()  { if (dragging) { renderPanel(); dragging = null; } }
function onTouchEnd() { if (dragging) { renderPanel(); dragging = null; } }

// ─── PREVIEW MODE ────────────────────────────────────────────────
function enterPreview() {
  document.body.classList.add('preview');
  setTimeout(renderAll, 50);  // re-render after layout settles
}
function exitPreview() {
  document.body.classList.remove('preview');
  setTimeout(renderAll, 50);
}
</script>
</body>
</html>
