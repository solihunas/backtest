<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Input — Strategy Tester Report</title>
<style>
  :root{
    --page-bg:#e7e9ec; --page-bg-dark:#1c1e22;
    --panel-bg:#f4f5f7; --panel-bg-dark:#26282c;
    --panel-ink:#1a1a1a; --panel-ink-dark:#e6e7e9;
    --panel-border:#d3d6da; --panel-border-dark:#3a3d42;
  }
  @media (prefers-color-scheme: dark){
    :root{ --shell-bg:var(--page-bg-dark); --panel:var(--panel-bg-dark); --ink:var(--panel-ink-dark); --border:var(--panel-border-dark); }
  }
  :root{ --shell-bg:var(--page-bg); --panel:var(--panel-bg); --ink:var(--panel-ink); --border:var(--panel-border); }
  :root[data-theme="dark"]{ --shell-bg:var(--page-bg-dark); --panel:var(--panel-bg-dark); --ink:var(--panel-ink-dark); --border:var(--panel-border-dark); }
  :root[data-theme="light"]{ --shell-bg:var(--page-bg); --panel:var(--panel-bg); --ink:var(--panel-ink); --border:var(--panel-border); }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--shell-bg); color:var(--ink);
    font-family:Tahoma, "Segoe UI", Arial, sans-serif;
    padding-bottom:64px; /* room for sticky action bar */
  }

  .topbar{
    padding:10px 12px; font-weight:700; font-size:14px;
    border-bottom:1px solid var(--border); background:var(--panel);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .syncBadge{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:10px; white-space:nowrap; }
  .syncBadge.dirty{ background:#fde3b0; color:#7a4a00; }
  .syncBadge.synced{ background:#c8ecc8; color:#1a5e1a; }

  .chartWrap{ padding:8px; }
  .chartWrap canvas{ display:block; width:100%; background:#fff; border:1px solid var(--border); border-radius:4px; }

  .summary{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr));
    gap:6px; padding:0 8px 8px;
  }
  .summary .tile{
    background:var(--panel); border:1px solid var(--border); border-radius:6px;
    padding:6px 8px;
  }
  .summary .tile .k{ font-size:9px; opacity:.7; text-transform:uppercase; letter-spacing:.03em; }
  .summary .tile .v{ font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }

  form{ padding:0 8px; }
  details{
    background:var(--panel); border:1px solid var(--border); border-radius:6px;
    margin-bottom:8px; overflow:hidden;
  }
  summary{
    padding:9px 10px; font-size:12px; font-weight:700; cursor:pointer;
    list-style:none; display:flex; align-items:center; gap:6px;
  }
  summary::-webkit-details-marker{ display:none; }
  summary::before{ content:"▸"; font-size:10px; opacity:.6; transition:transform .15s; }
  details[open] summary::before{ transform:rotate(90deg); }

  .grid2{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    gap:6px 8px; padding:0 10px 10px;
  }
  .field{ display:flex; flex-direction:column; gap:2px; }
  .field label{ font-size:9.5px; opacity:.8; }
  .field input{
    font-size:13px; padding:6px 7px; border:1px solid var(--border); border-radius:5px;
    background:#fff; color:#111; width:100%;
  }

  .actionBar{
    position:sticky; bottom:0; left:0; right:0;
    display:grid; grid-template-columns:repeat(4,1fr);
    gap:6px; padding:8px; background:var(--panel);
    border-top:1px solid var(--border); z-index:10;
  }
  .actionBar button, .actionBar a{
    font:12px Tahoma, Arial, sans-serif; font-weight:700;
    padding:11px 4px; border-radius:6px; border:1px solid var(--border);
    background:#fff; color:#222; text-align:center; text-decoration:none;
    cursor:pointer;
  }
  .actionBar .sync{ background:#2233aa; color:#fff; border-color:#2233aa; }
  .actionBar button:disabled{ opacity:.4; }
  .previewLink{
    display:block; margin:0 8px 10px; text-align:center;
    background:#00963a; color:#fff; font-weight:700; font-size:13px;
    padding:12px; border-radius:6px; text-decoration:none;
  }
</style>
</head>
<body>

  <div class="topbar">
    <span>📥 Input Data — Strategy Tester Report</span>
    <span class="syncBadge synced" id="syncBadge">✓ Tersinkron</span>
  </div>

  <div class="chartWrap"><canvas id="chart" width="1500" height="348"></canvas></div>

  <div class="summary" id="summary"></div>

  <a class="previewLink" href="preview.html" id="previewLink">👁 Buka Halaman Preview + Download →</a>

  <form onsubmit="return false;">
    <details open>
      <summary>Umum</summary>
      <div class="grid2">
        <div class="field"><label>Initial Deposit</label><input type="number" id="qsInitialDeposit" step="0.01"></div>
        <div class="field"><label>Bars</label><input type="number" id="qsBars" step="1"></div>
        <div class="field"><label>Ticks</label><input type="number" id="qsTicks" step="1"></div>
        <div class="field"><label>Sharpe Ratio</label><input type="number" id="qsSharpeRatio" step="0.01"></div>
      </div>
    </details>

    <details open>
      <summary>Trades — Win / Lose</summary>
      <div class="grid2">
        <div class="field"><label>Winning Trades</label><input type="number" id="qsWinningTrades" step="1"></div>
        <div class="field"><label>Losing Trades</label><input type="number" id="qsLosingTrades" step="1"></div>
        <div class="field"><label>Gross Profit ($)</label><input type="number" id="qsGrossProfit" step="0.01"></div>
        <div class="field"><label>Gross Loss ($, positif)</label><input type="number" id="qsGrossLoss" step="0.01"></div>
        <div class="field"><label>Largest Profit Trade</label><input type="number" id="qsLargestProfitTrade" step="0.01"></div>
        <div class="field"><label>Largest Loss Trade (positif)</label><input type="number" id="qsLargestLossTrade" step="0.01"></div>
        <div class="field"><label>Total Deals</label><input type="number" id="qsTotalDeals" step="1"></div>
      </div>
    </details>

    <details>
      <summary>Short / Long</summary>
      <div class="grid2">
        <div class="field"><label>Short Trades</label><input type="number" id="qsShortTrades" step="1"></div>
        <div class="field"><label>Short Won %</label><input type="number" id="qsShortWonPct" step="0.01"></div>
        <div class="field"><label>Long Trades</label><input type="number" id="qsLongTrades" step="1"></div>
        <div class="field"><label>Long Won %</label><input type="number" id="qsLongWonPct" step="0.01"></div>
      </div>
    </details>

    <details>
      <summary>Consecutive Wins / Losses</summary>
      <div class="grid2">
        <div class="field"><label>Max Consec. Wins (count)</label><input type="number" id="qsMaxConsecWinsCount" step="1"></div>
        <div class="field"><label>Max Consec. Wins ($)</label><input type="number" id="qsMaxConsecWinsAmount" step="0.01"></div>
        <div class="field"><label>Max Consec. Losses (count)</label><input type="number" id="qsMaxConsecLossesCount" step="1"></div>
        <div class="field"><label>Max Consec. Losses ($, positif)</label><input type="number" id="qsMaxConsecLossesAmount" step="0.01"></div>
        <div class="field"><label>Maximal Consec. Profit ($)</label><input type="number" id="qsMaxConsecProfitAmount" step="0.01"></div>
        <div class="field"><label>Maximal Consec. Profit (count)</label><input type="number" id="qsMaxConsecProfitCount" step="1"></div>
        <div class="field"><label>Maximal Consec. Loss ($, positif)</label><input type="number" id="qsMaxConsecLossAmount" step="0.01"></div>
        <div class="field"><label>Maximal Consec. Loss (count)</label><input type="number" id="qsMaxConsecLossCount" step="1"></div>
      </div>
    </details>

    <details>
      <summary>Drawdown</summary>
      <div class="grid2">
        <div class="field"><label>Balance DD Absolute</label><input type="number" id="qsBalanceDDAbsolute" step="0.01"></div>
        <div class="field"><label>Balance DD Maximal ($)</label><input type="number" id="qsBalanceDDMaxAmount" step="0.01"></div>
        <div class="field"><label>Balance DD Maximal (%)</label><input type="number" id="qsBalanceDDMaxPct" step="0.01"></div>
        <div class="field"><label>Balance DD Relative (%)</label><input type="number" id="qsBalanceDDRelPct" step="0.01"></div>
        <div class="field"><label>Balance DD Relative ($)</label><input type="number" id="qsBalanceDDRelAmount" step="0.01"></div>
        <div class="field"><label>Equity DD Absolute</label><input type="number" id="qsEquityDDAbsolute" step="0.01"></div>
        <div class="field"><label>Equity DD Maximal ($)</label><input type="number" id="qsEquityDDMaxAmount" step="0.01"></div>
        <div class="field"><label>Equity DD Maximal (%)</label><input type="number" id="qsEquityDDMaxPct" step="0.01"></div>
        <div class="field"><label>Equity DD Relative (%)</label><input type="number" id="qsEquityDDRelPct" step="0.01"></div>
        <div class="field"><label>Equity DD Relative ($)</label><input type="number" id="qsEquityDDRelAmount" step="0.01"></div>
      </div>
    </details>

    <details>
      <summary>Chart — tanggal & label</summary>
      <div class="grid2">
        <div class="field"><label>Start Date</label><input type="date" id="cfgStart"></div>
        <div class="field"><label>End Date</label><input type="date" id="cfgEnd"></div>
        <div class="field"><label>Margin Level Label</label><input type="text" id="cfgMargin"></div>
      </div>
    </details>
  </form>

  <div class="actionBar">
    <button type="button" class="sync" id="btnSync">Sinkronkan</button>
    <button type="button" id="btnRandom">Acak</button>
    <button type="button" id="btnSmooth">Haluskan</button>
    <button type="button" id="btnUndo" disabled>Undo</button>
  </div>

<script src="report-core.js"></script>
<script>
(function(){
  const RC = ReportCore;
  let state = RC.loadState() || RC.defaultState();
  let qs = Object.assign({}, state.qs);   // working copy — only committed on Sinkronkan
  let cfg = Object.assign({}, state.cfg); // working copy
  let curve = state.curve;
  let undoStack = [];
  let dirty = false;

  const cvs = document.getElementById('chart');
  const badge = document.getElementById('syncBadge');
  const btnUndo = document.getElementById('btnUndo');

  function setDirty(v){
    dirty = v;
    badge.textContent = v ? '● Ada perubahan, klik Sinkronkan' : '✓ Tersinkron';
    badge.className = 'syncBadge ' + (v ? 'dirty' : 'synced');
  }

  function render(){
    const dateLabels = RC.buildDateLabels(cfg.dateStart || '2025-01-01', cfg.dateEnd || '2025-12-31', 12);
    RC.drawChart(cvs, curve, dateLabels, cfg.marginLabel);

    const { totalTrades, totalNetProfit } = RC.computeRows(qs);
    const profitFactor = qs.grossLoss !== 0 ? qs.grossProfit / qs.grossLoss : 0;
    const tiles = [
      ['Total Trades', RC.fmtInt(totalTrades)],
      ['Net Profit', RC.fmtNum(totalNetProfit)],
      ['Profit Factor', profitFactor.toFixed(2)],
      ['Initial Deposit', RC.fmtNum(qs.initialDeposit)]
    ];
    document.getElementById('summary').innerHTML = tiles.map(([k,v]) =>
      `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`
    ).join('');

    btnUndo.disabled = undoStack.length === 0;
  }

  function persist(){
    RC.saveState({ qs, cfg, curve });
  }

  // ---- field bindings: typing only updates the in-memory working copy ----
  function bindQS(id, key){
    const el = document.getElementById(id);
    el.value = qs[key];
    el.addEventListener('input', () => { qs[key] = parseFloat(el.value) || 0; setDirty(true); });
  }
  function bindCfg(id, key){
    const el = document.getElementById(id);
    el.value = cfg[key];
    el.addEventListener('input', () => { cfg[key] = el.value; setDirty(true); });
  }
  [
    ['qsInitialDeposit','initialDeposit'], ['qsBars','bars'], ['qsTicks','ticks'],
    ['qsWinningTrades','winningTrades'], ['qsLosingTrades','losingTrades'],
    ['qsGrossProfit','grossProfit'], ['qsGrossLoss','grossLoss'],
    ['qsLargestProfitTrade','largestProfitTrade'], ['qsLargestLossTrade','largestLossTrade'],
    ['qsShortTrades','shortTrades'], ['qsShortWonPct','shortWonPct'],
    ['qsLongTrades','longTrades'], ['qsLongWonPct','longWonPct'],
    ['qsTotalDeals','totalDeals'],
    ['qsMaxConsecWinsCount','maxConsecWinsCount'], ['qsMaxConsecWinsAmount','maxConsecWinsAmount'],
    ['qsMaxConsecLossesCount','maxConsecLossesCount'], ['qsMaxConsecLossesAmount','maxConsecLossesAmount'],
    ['qsMaxConsecProfitAmount','maxConsecProfitAmount'], ['qsMaxConsecProfitCount','maxConsecProfitCount'],
    ['qsMaxConsecLossAmount','maxConsecLossAmount'], ['qsMaxConsecLossCount','maxConsecLossCount'],
    ['qsBalanceDDAbsolute','balanceDDAbsolute'], ['qsBalanceDDMaxAmount','balanceDDMaxAmount'], ['qsBalanceDDMaxPct','balanceDDMaxPct'],
    ['qsBalanceDDRelPct','balanceDDRelPct'], ['qsBalanceDDRelAmount','balanceDDRelAmount'],
    ['qsEquityDDAbsolute','equityDDAbsolute'], ['qsEquityDDMaxAmount','equityDDMaxAmount'], ['qsEquityDDMaxPct','equityDDMaxPct'],
    ['qsEquityDDRelPct','equityDDRelPct'], ['qsEquityDDRelAmount','equityDDRelAmount'],
    ['qsSharpeRatio','sharpeRatio']
  ].forEach(([id,key]) => bindQS(id,key));
  bindCfg('cfgStart','dateStart');
  bindCfg('cfgEnd','dateEnd');
  bindCfg('cfgMargin','marginLabel');

  // ---- Sinkronkan: commit form -> stats + rescale curve endpoints ----
  document.getElementById('btnSync').addEventListener('click', () => {
    const { totalNetProfit } = RC.computeRows(qs);
    const newStart = qs.initialDeposit, newEnd = qs.initialDeposit + totalNetProfit;
    curve = RC.rescaleCurve(curve, newStart, newEnd);
    undoStack = [];
    setDirty(false);
    persist();
    render();
  });

  // ---- Acak: nudge each point up / down / unchanged ----
  document.getElementById('btnRandom').addEventListener('click', () => {
    undoStack.push(JSON.parse(JSON.stringify(curve)));
    if (undoStack.length > 20) undoStack.shift();
    curve = RC.randomizeCurve(curve);
    persist();
    render();
  });

  // ---- Haluskan: moving-average smoothing pass ----
  document.getElementById('btnSmooth').addEventListener('click', () => {
    undoStack.push(JSON.parse(JSON.stringify(curve)));
    if (undoStack.length > 20) undoStack.shift();
    curve = RC.smoothCurve(curve, 3);
    persist();
    render();
  });

  // ---- Undo: revert the last Acak / Haluskan step ----
  document.getElementById('btnUndo').addEventListener('click', () => {
    if (!undoStack.length) return;
    curve = undoStack.pop();
    persist();
    render();
  });

  render();
})();
</script>
</body>
</html>
